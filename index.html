<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - ecurrencyhodler</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="name">ecurrencyhodler</h1>
            <p class="tagline">Support the cause</p>
        </header>
        
        <main>
            <div class="donation-section">
                <h2>Make a Donation</h2>
                <p class="description">Choose an amount to donate</p>
                
                <div class="button-group">
                    <button class="donation-btn" data-amount="10">
                        <span class="amount">$10</span>
                        <span class="currency">USD</span>
                    </button>
                    <button class="donation-btn" data-amount="100">
                        <span class="amount">$100</span>
                        <span class="currency">USD</span>
                    </button>
                    <button class="donation-btn" data-amount="1000">
                        <span class="amount">$1,000</span>
                        <span class="currency">USD</span>
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
